name: B0 geometry validation tests
on:
  pull_request:
    paths:
      - 'scripts/b0_validation/**'
      - 'src/B0GeometryAudit.cpp'
      - '.github/workflows/b0-validation.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - run: python -m unittest discover -s scripts/b0_validation -v
